<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SafetyNet — Vulnerability Report Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;750&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css" />
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect} = React;

const SEV = {
  critical: {label: "CRITICAL", color: "var(--crit)", bg: "var(--crit-bg)"},
  high:     {label: "HIGH",     color: "var(--high)", bg: "var(--high-bg)"},
  medium:   {label: "MEDIUM",   color: "var(--med)",  bg: "var(--med-bg)"},
  low:      {label: "LOW",      color: "var(--low)",  bg: "var(--low-bg)"},
  info:     {label: "INFO",     color: "var(--info)", bg: "var(--info-bg)"},
};
const SEV_ORDER = ["critical", "high", "medium", "low", "info"];

async function api(path, opt) {
  const r = await fetch(path, opt);
  if (!r.ok) {
    const d = await r.json().catch(() => ({detail: r.statusText}));
    throw new Error(d.detail || r.statusText);
  }
  return r.json();
}

/* ---------- small components ---------- */
function Badge({sev}) {
  const s = SEV[sev] || SEV.info;
  return <span className="badge" style={{background: s.bg, color: s.color}}>{s.label}</span>;
}

function ThemeToggle() {
  const [dark, setDark] = useState(() =>
    (localStorage.getItem("sn-theme") ||
     (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark");
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    try { localStorage.setItem("sn-theme", dark ? "dark" : "light"); } catch {}
  }, [dark]);
  return <button className="icon-btn" title="Đổi giao diện" onClick={() => setDark(d => !d)}>
    {dark ? "☾" : "☀"}</button>;
}

function Counts({findings}) {
  const counts = {};
  findings.forEach(f => { const s = (f.label || {}).severity || "info"; counts[s] = (counts[s] || 0) + 1; });
  const total = findings.length || 1;
  const present = SEV_ORDER.filter(s => counts[s]);
  return <div>
    <div className="sevbar">
      {present.map(s => <div key={s} title={`${SEV[s].label}: ${counts[s]}`}
        style={{width: `${(counts[s] / total) * 100}%`, background: SEV[s].color}} />)}
    </div>
    <div className="sevlegend">
      {present.map(s => <span key={s}>
        <span className="sw" style={{background: SEV[s].color}} />{SEV[s].label} · {counts[s]}</span>)}
    </div>
  </div>;
}

function Kpis({rep}) {
  const c = {};
  rep.findings.forEach(f => { const s = (f.label || {}).severity || "info"; c[s] = (c[s] || 0) + 1; });
  const tiles = [
    {n: rep.findings.length, l: "Findings"},
    {n: c.critical || 0, l: "Critical", cls: "crit"},
    {n: c.high || 0, l: "High", cls: "high"},
    {n: "$" + (rep.cost_usd || 0).toFixed(2), l: "Chi phí"},
    {n: Math.round(rep.wall_duration_s || 0) + "s", l: "Thời gian"},
  ];
  return <div className="kpis">
    {tiles.map((t, i) => <div key={i} className={"kpi " + (t.cls || "")}>
      <div className="n">{t.n}</div><div className="l">{t.l}</div></div>)}
  </div>;
}

function Finding({f, i}) {
  const L = f.label || {};
  return <div className={"finding " + (L.severity || "info")}>
    <h3><span className="num">{i}.</span> {L.vuln_class || "Observation"} <Badge sev={L.severity}/></h3>
    <div className="chips">
      {L.cwe && <span className="chip mono">{L.cwe}</span>}
      {L.owasp && <span className="chip">{L.owasp}</span>}
      <span className="chip">confidence: {L.confidence}</span>
      <span className="chip">task: {f.task_kind || "—"}</span>
    </div>
    {L.explanation && <div className="kv"><b>Giải thích.</b> {L.explanation}</div>}
    {L.remediation && <div className="kv"><b>Khắc phục.</b> {L.remediation}</div>}
    {(f.request || f.response) &&
      <details>
        <summary>Bằng chứng — request &amp; response</summary>
        {f.request && <pre>{"$ " + f.request}</pre>}
        {f.response && <pre>{f.response.slice(0, 1400)}</pre>}
      </details>}
  </div>;
}

function Report({rep}) {
  const src = rep.engine === "replay" ? "sample" : "live";
  return <div className="card">
    <div className="card-b">
      <div className="rep-head">
        <h2>{rep.run_id}</h2>
        <div className="rep-actions no-print">
          <button className="btn ghost sm" onClick={() => window.print()}>⎙ In / PDF</button>
          <a href={`/api/report/${src}/${rep.run_id}/markdown`}>
            <button className="btn ghost sm">↓ Markdown</button></a>
        </div>
      </div>

      <Kpis rep={rep} />
      {rep.findings.length > 0 && <Counts findings={rep.findings} />}

      <div className="meta-grid">
        <div className="meta-cell"><b>Goal</b><span>{rep.goal || "—"}</span></div>
        <div className="meta-cell"><b>Target</b><span>{(rep.targets || []).join(", ") || "—"}</span></div>
        <div className="meta-cell"><b>Engine</b><span>{rep.engine}</span></div>
        <div className="meta-cell"><b>Trạng thái</b><span>{rep.status}</span></div>
        <div className="meta-cell"><b>Phân loại bởi</b><span>{rep.labeled_by}</span></div>
      </div>

      {rep.status !== "completed" &&
        <div className="warnbox">
          <span>⚠️</span>
          <div><b>Run không hoàn tất</b> — kết quả không kết luận được ("không tìm thấy" khác "run lỗi").
            <br/><code>{rep.error || "unknown"}</code></div>
        </div>}

      {rep.findings.map((f, i) => <Finding key={f.id} f={f} i={i + 1} />)}
      {rep.findings.length === 0 &&
        <p className="hint">Run này không có observation nào để phân loại.</p>}
    </div>
  </div>;
}

/* ---------- app ---------- */
function App() {
  const [types, setTypes] = useState([]);
  const [runs, setRuns] = useState([]);
  const [target, setTarget] = useState("http://127.0.0.1:3000");
  const [scanType, setScanType] = useState("general");
  const [report, setReport] = useState(null);
  const [activeRun, setActiveRun] = useState(null);
  const [status, setStatus] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    api("/api/scan-types").then(setTypes).catch(() => {});
    api("/api/runs").then(setRuns).catch(() => {});
  }, []);

  async function viewSample(run_id) {
    setStatus(""); setActiveRun(run_id);
    try { setReport(await api(`/api/report/sample/${run_id}`)); }
    catch (e) { setStatus("Lỗi: " + e.message); }
  }

  async function startScan() {
    setBusy(true); setStatus("Đang gửi yêu cầu…"); setReport(null); setActiveRun(null);
    try {
      const {job_id} = await api("/api/scan", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({target, scan_type: scanType}),
      });
      const poll = async () => {
        const j = await api(`/api/scan/${job_id}`);
        setStatus("Trạng thái: " + j.status + "…");
        if (j.status === "done") { setReport(j.report); setStatus(""); setBusy(false); }
        else if (j.status === "error") { setStatus("Scan lỗi: " + j.error); setBusy(false); }
        else setTimeout(poll, 2500);
      };
      poll();
    } catch (e) { setStatus("Lỗi: " + e.message); setBusy(false); }
  }

  const isErr = /lỗi|Lỗi/.test(status);

  return <div>
    <div className="appbar">
      <div className="brand">
        <span className="logo">🛡</span> SafetyNet <span className="ver">v0.1</span>
      </div>
      <div className="spacer" />
      <span className="scopebadge"><span className="dot" /> Local-only scope</span>
      <ThemeToggle />
    </div>

    <div className="wrap">
      <div className="hero">
        <h1>Vulnerability Report Studio</h1>
        <p>Nhập URL web <b>local</b> được phép kiểm thử → agent quét trong môi trường cô lập →
          báo cáo lỗ hổng truy vết được tới bằng chứng. AI chỉ tổng hợp &amp; giải thích,
          không tự quyết định tấn công.</p>
      </div>

      <div className="grid">
        {/* left column: controls */}
        <div>
          <div className="card">
            <div className="card-h"><p className="card-title">Quét live</p></div>
            <div className="card-b">
              <div className="field">
                <label className="label">Target URL (local)</label>
                <input value={target} onChange={e => setTarget(e.target.value)}
                  placeholder="http://127.0.0.1:3000" />
              </div>
              <div className="field">
                <label className="label">Loại scan</label>
                <select value={scanType} onChange={e => setScanType(e.target.value)}>
                  {types.map(t => <option key={t.key} value={t.key}>{t.label}</option>)}
                </select>
              </div>
              <button className="btn" onClick={startScan} disabled={busy}>
                {busy ? <><span className="spin" /> Đang quét…</> : "⚡ Bắt đầu quét"}</button>
              <div className={"hint" + (isErr ? " err" : "")}>
                {status || "Chỉ chấp nhận localhost / 127.0.0.0/8 / ::1. Cần Docker Desktop + target đang chạy."}
              </div>
            </div>
          </div>

          <div className="card">
            <div className="card-h"><p className="card-title">Demo — run đã lưu (replay)</p></div>
            <div className="card-b">
              <div className="runs">
                {runs.map(r => <div key={r.run_id}
                  className={"run" + (activeRun === r.run_id ? " active" : "")}
                  onClick={() => viewSample(r.run_id)}>
                  <span className="rid">{r.run_id}</span>
                  <span className="rmeta">{r.goal}</span>
                  <span className="rmeta">{r.status} · {(r.targets || []).join(", ")}</span>
                </div>)}
                {runs.length === 0 && <span className="hint">Chưa có run mẫu nào.</span>}
              </div>
              <div className="hint">Replay không cần Docker, không tốn phí, tất định — dùng cho demo.</div>
            </div>
          </div>
        </div>

        {/* right column: report */}
        <div>
          {report ? <Report rep={report} /> :
            <div className="card"><div className="empty">
              <div className="big">🛡</div>
              <div><b>Chưa có báo cáo</b></div>
              <div className="hint">Chọn một run đã lưu bên trái, hoặc bắt đầu một lần quét live.</div>
            </div></div>}
        </div>
      </div>

      <footer>SafetyNet · dự án khoa học · AI tổng hợp kết quả scan, không tự quyết định tấn công</footer>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
