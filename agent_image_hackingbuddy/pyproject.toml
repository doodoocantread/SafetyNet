[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safetynet-hackingbuddy-agent"
version = "0.1.0"
description = "SafetyNet wrapper: runs hackingBuddyGPT's web use-case and emits SafetyNet's summary.json + traces."
# hackingBuddyGPT requires Python >=3.13.
requires-python = ">=3.13,<4.0"
# hackingBuddyGPT is on PyPI. Pinned so agent behaviour does not drift under us;
# bump deliberately. It pulls in litellm (the single LLM upstream) transitively.
dependencies = [
    "hackingBuddyGPT==0.5.0",
]

[project.scripts]
safetynet-hackingbuddy-agent = "safetynet_hb_agent.cli:main"

[tool.setuptools]
packages = ["safetynet_hb_agent"]
