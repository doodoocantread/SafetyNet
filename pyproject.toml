[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safetywebbing"
version = "0.1.0"
description = "SafetyWebbing — turns authorized local scan results into vulnerability reports. The AI summarizes; it does not decide to attack."
requires-python = ">=3.12,<4.0"
# The host app only orchestrates. It does NOT import unified-agent or run the
# pentest agent in-process — that happens inside the Docker image (agent_image/).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["safetywebbing", "safetywebbing.engines"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
